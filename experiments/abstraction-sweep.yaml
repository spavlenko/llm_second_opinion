# Paths are relative to this file. ${VAR} and ${VAR:-default} read the environment;
# quote them inside {...} flow mappings.
name: abstraction-sweep
tasks: ../tasks/manifests/mswe-mini-cpp-v2.yaml
split: dev
seeds: 3
limits: {wall_minutes: 40, max_turns: 80}

models:
  local:   {base_url: "${LOCAL_MODEL_URL}", model: qwen3.8}
  advisor: {base_url: "${ADVISOR_URL}", model: k3, reasoning_effort: high, api_key_env: ADVISOR_API_KEY}

# Prompt sets: `default` is ../prompts/default/ unless defined here. A set is a directory with
# one <slot>.md per slot, or another set with some slots replaced.
prompts:
  structured: {base: default, brief: ../prompts/structured/brief.md}
  hints-only: {base: default, advisor_system: ../prompts/hints-only/advisor_system.md}

arms:
  - {name: A0, agent: pi, executor: local}
  - name: A2
    agent: pi
    executor: local
    advisor:
      level: L2
      prompts: default
      interventions: [plan, consult, stuck]
      max_consults: 5
      stuck: {repeat_calls: 3, same_error: 3, no_diff_turns: 8}
  - {name: A4, agent: pi, executor: advisor}
