# Smoke suite, real tasks: the 3-task `dev` smoke subset (quickest, one per repository), with
# harness triggers (stuck, test failure) on real C++ builds. Never use `test` for smoke runs.
#   bench run experiments/smoke-real.yaml --runs-dir /tmp/lso-smoke
#   harness/.venv/bin/python scripts/smoke-check.py /tmp/lso-smoke/smoke-real
name: smoke-real
tasks: ../tasks/manifests/mswe-mini-cpp-v2-smoke.yaml
split: dev
seeds: 1
limits: {wall_minutes: 30, max_turns: 60}
execution: {parallel: 3, cpus: 4, memory_gb: 6, grade_minutes: 20}

models:
  local:
    base_url: "${LOCAL_MODEL_URL}"
    model: qwen3.8-27b
    reasoning_effort: medium
    temperature: 0.6   # Qwen's thinking-mode setting; the server is not deterministic anyway
    top_p: 0.95
    api_key_env: LOCAL_API_KEY
    headers: {"${LOCAL_SESSION_HEADER}": "${LOCAL_SESSION}"}
    header_env: {"${LOCAL_AUTH_HEADER}": LOCAL_AUTH_KEY}
  advisor:
    base_url: "${ADVISOR_URL}"
    model: kimi-k3
    reasoning_effort: high
    api_key_env: ADVISOR_API_KEY


agents:
  pi:
    adapter: pi
    version: "0.99.1"
    options:
      context_window: 140000
      max_output_tokens: 60000
      thinking_level_map:
        {"off": none, minimal: low, low: low, medium: medium, high: xhigh, xhigh: xhigh, max: xhigh}
      compat: {supportsReasoningEffort: true, supportsDeveloperRole: false}
  pi-advisor:  # Kimi rejects the `developer` role pi uses for reasoning models
    adapter: pi
    version: "0.99.1"
    options: {compat: {supportsDeveloperRole: false}}

arms:
  - name: H
    agent: pi
    executor: local
    advisor:
      level: L2
      interventions: [orient, consult, stuck, on_test_failure, before_done]
      max_consults: 4
      cooldown_turns: 2
