[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-second-opinion"
version = "0.0.1"
description = "Harness for evaluating coding agents with a cloud advisor on validated C++ tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "docker>=7.0",
    "mlflow>=3.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bench = "llm_second_opinion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_second_opinion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a Docker daemon (skipped when none is running)"]
