- id: catchorg__Catch2-1614
  image: llm-second-opinion/task-catchorg__catch2-1614:1
  image_id: sha256:a4e310eae5a11dbf841315901d6b54f960176b4c293e205179a1873108dc1389
  problem_statement: "Allow custom precision in error reports for floating-point numbers\n\n**Description**\n\
    As in [this SO Q&A](https://stackoverflow.com/q/55867570/201787), it would be nice to allow customization\
    \ of the precision of floating-point values that fail. At present, the precision for float and double\
    \ are hard-coded within Catch2 to 5 and 10, respectively:\n```cpp\nstd::string StringMaker<float>::convert(float\
    \ value) {\n    return fpToString(value, 5) + 'f';\n}\nstd::string StringMaker<double>::convert(double\
    \ value) {\n    return fpToString(value, 10);\n}\n```\nSometimes things will fail (even with `Approx()`),\
    \ but the precision of the failure message doesn't show enough precision to be meaningful.\n```\n\
    prog.cc:22: FAILED:\n  REQUIRE( TestType(0) == std::numeric_limits<TestType>::epsilon() )\nwith expansion:\n\
    \  0.0f == 0.0f\n```\nThe proposal here is to add a `setPrecision()` function to allow the user to\
    \ control this. I have prototyped this, which you can see running [live on Wandbox](https://wandbox.org/permlink/mZXPLEuET5ZeTg1t).\
    \ Here's the test:\n```cpp\nTEMPLATE_TEST_CASE( \"Double, double, toil and trouble\", \"[double]\"\
    , float, double ) \n{\n    const auto precision = GENERATE( -1, 0, 3, std::numeric_limits<TestType>::max_digits10\
    \ );\n\n    if( precision >= 0 )\n    {\n        Catch::StringMaker<TestType>::setPrecision( precision\
    \ );\n    }\n    \n    // Expected to fail to demonstrate the problem\n    REQUIRE( TestType(0) ==\
    \ std::numeric_limits<TestType>::epsilon() ); \n}\n```\nThe output shows as expected for floats and\
    \ doubles. For instance:\n```\nprog.cc:15: FAILED:\n  REQUIRE( TestType(0) == std::numeric_limits<TestType>::epsilon()\
    \ )\nwith expansion:\n  0.0f == 0.000000119f\n```\nMaking a unit test for this is a little iffy since\
    \ the actual string values are dependent on the usual floating-point fuzziness. I guess it could compare\
    \ string length without looking too closely at the value."
