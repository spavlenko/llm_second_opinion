    {}\", sat), \"Sat\");\n-  EXPECT_EQ(fmt::format(\"{:%a}\", tm), \"Sat\");\n+  EXPECT_EQ(fmt::format(\"\
    {:%a}\", sat), \"Sat\");\n+  EXPECT_EQ(fmt::format(\"{:%A}\", sat), \"Saturday\");\n \n+  auto loc\
    \ = get_locale(\"es_ES.UTF-8\");\n+  std::locale::global(loc);\n   if (loc != std::locale::classic())\
