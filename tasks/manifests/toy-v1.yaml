# Toy tasks for harness smoke tests; build the image with
#   docker build -t llm-second-opinion/toy:1 tasks/toy
version: toy-v1
tasks:
- id: toy-add
  image: llm-second-opinion/toy:1
  workdir: /testbed
  problem_statement: '`add 2 3` prints -1; it should print 5.'
  test_patch: |
    diff --git a/tests/test_add.sh b/tests/test_add.sh
    new file mode 100644
    index 0000000..5e9975c
    --- /dev/null
    +++ b/tests/test_add.sh
    @@ -0,0 +1,3 @@
    +. ./math.sh
    +[ "$(add 2 3)" = 5 ] || { echo "add 2 3 != 5"; exit 1; }
    +echo ok
  gold_patch: "diff --git a/math.sh b/math.sh\nindex 452d308..b71e46d 100644\n--- a/math.sh\n+++ b/math.sh\n\
    @@ -1,7 +1,7 @@\n # Integer helpers for POSIX sh.\n \n add() {\n-  echo $(($1 - $2))\n+  echo $(($1\
    \ + $2))\n }\n \n max() {\n"
  eval_command: sh tests/test_add.sh
- id: toy-max
  image: llm-second-opinion/toy:1
  workdir: /testbed
  problem_statement: '`max 2 3` prints 2; it should print the larger number.'
  test_patch: |
    diff --git a/tests/test_max.sh b/tests/test_max.sh
    new file mode 100644
    index 0000000..a61a336
    --- /dev/null
    +++ b/tests/test_max.sh
    @@ -0,0 +1,3 @@
    +. ./math.sh
    +[ "$(max 2 3)" = 3 ] || { echo "max 2 3 != 3"; exit 1; }
    +echo ok
  gold_patch: "diff --git a/math.sh b/math.sh\nindex 452d308..58a20fc 100644\n--- a/math.sh\n+++ b/math.sh\n\
    @@ -5,5 +5,5 @@ add() {\n }\n \n max() {\n-  if [ \"$1\" -lt \"$2\" ]; then echo \"$1\"; else echo\
    \ \"$2\"; fi\n+  if [ \"$1\" -gt \"$2\" ]; then echo \"$1\"; else echo \"$2\"; fi\n }\n"
  eval_command: sh tests/test_max.sh
