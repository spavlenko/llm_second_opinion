    @@ -0,0 +1,405 @@\n+/*\n+ *  Created by Joachim on 16/04/2019.\n+ *  Adapted from donated nonius code.\n\
    + *\n+ *  Distributed under the Boost Software License, Version 1.0. (See accompanying\n+ *  file\
