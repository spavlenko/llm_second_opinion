  gold_patch: "diff --git a/docs/benchmarks.md b/docs/benchmarks.md\nnew file mode 100644\nindex 0000000000..3426b365a9\n\
    --- /dev/null\n+++ b/docs/benchmarks.md\n@@ -0,0 +1,249 @@\n+# Authoring benchmarks\n+\n+Writing benchmarks\
    \ is not easy. Catch simplifies certain aspects but you'll\n+always need to take care about various\
    \ aspects. Understanding a few things about\n+the way Catch runs your code will be very helpful when\
    \ writing your benchmarks.\n+\n+First off, let's go over some terminology that will be used throughout\
    \ this\n+guide.\n+\n+- *User code*: user code is the code that the user provides to be measured.\n\
    +- *Run*: one run is one execution of the user code.\n+- *Sample*: one sample is one data point obtained\
    \ by measuring the time it takes\n+  to perform a certain number of runs. One sample can consist of\
    \ more than one\n+  run if the clock available does not have enough resolution to accurately\n+  measure\
    \ a single run. All samples for a given benchmark execution are obtained\n+  with the same number\
    \ of runs.\n+\n+## Execution procedure\n+\n+Now I can explain how a benchmark is executed in Catch.\
    \ There are three main\n+steps, though the first does not need to be repeated for every benchmark.\n\
    +\n+1. *Environmental probe*: before any benchmarks can be executed, the clock's\n+resolution is estimated.\
    \ A few other environmental artifacts are also estimated\n+at this point, like the cost of calling\
    \ the clock function, but they almost\n+never have any impact in the results.\n+\n+2. *Estimation*:\
    \ the user code is executed a few times to obtain an estimate of\n+the amount of runs that should\
    \ be in each sample. This also has the potential\n+effect of bringing relevant code and data into\
    \ the caches before the actual\n+measurement starts.\n+\n+3. *Measurement*: all the samples are collected\
    \ sequentially by performing the\n+number of runs estimated in the previous step for each sample.\n\
    +\n+This already gives us one important rule for writing benchmarks for Catch: the\n+benchmarks must\
    \ be repeatable. The user code will be executed several times, and\n+the number of times it will be\
    \ executed during the estimation step cannot be\n+known beforehand since it depends on the time it\
    \ takes to execute the code.\n+User code that cannot be executed repeatedly will lead to bogus results\
    \ or\n+crashes.\n+\n+## Benchmark specification\n+\n+Benchmarks can be specified anywhere inside a\
    \ Catch test case.\n+There is a simple and a slightly more advanced version of the `BENCHMARK` macro.\n\
    +\n+Let's have a look how a naive Fibonacci implementation could be benchmarked:\n+```c++\n+std::uint64_t\
    \ Fibonacci(std::uint64_t number) {\n+    return number < 2 ? 1 : Fibonacci(number - 1) + Fibonacci(number\
    \ - 2);\n+}\n+```\n+Now the most straight forward way to benchmark this function, is just adding a\
    \ `BENCHMARK` macro to our test case:\n+```c++\n+TEST_CASE(\"Fibonacci\") {\n+    CHECK(Fibonacci(0)\
    \ == 1);\n+    // some more asserts..\n+    CHECK(Fibonacci(5) == 8);\n+    // some more asserts..\n\
    +\n+    // now let's benchmark:\n+    BENCHMARK(\"Fibonacci 20\") {\n+        return Fibonacci(20);\n\
    +    };\n+\n+    BENCHMARK(\"Fibonacci 25\") {\n+        return Fibonacci(25);\n+    };\n+\n+    BENCHMARK(\"\
    Fibonacci 30\") {\n+        return Fibonacci(30);\n+    };\n+\n+    BENCHMARK(\"Fibonacci 35\") {\n\
    +        return Fibonacci(35);\n+    };\n+}\n+```\n+There's a few things to note:\n+- As `BENCHMARK`\
    \ expands to a lambda expression it is necessary to add a semicolon after\n+ the closing brace (as\
    \ opposed to the first experimental version).\n+- The `return` is a handy way to avoid the compiler\
    \ optimizing away the benchmark code.\n+\n+Running this already runs the benchmarks and outputs something\
    \ similar to:\n+```\n+-------------------------------------------------------------------------------\n\
    +Fibonacci\n+-------------------------------------------------------------------------------\n+C:\\\
    path\\to\\Catch2\\Benchmark.tests.cpp(10)\n+...............................................................................\n\
    +benchmark name                                  samples       iterations    estimated\n+        \
    \                                        mean          low mean      high mean\n+                \
    \                                std dev       low std dev   high std dev\n+-------------------------------------------------------------------------------\n\
    +Fibonacci 20                                            100       416439   83.2878 ms\n+        \
    \                                               2 ns         2 ns         2 ns\n+                \
    \                                       0 ns         0 ns         0 ns\n+\n+Fibonacci 25         \
    \                                   100       400776   80.1552 ms\n+                             \
    \                          3 ns         3 ns         3 ns\n+                                     \
    \                  0 ns         0 ns         0 ns\n+\n+Fibonacci 30                              \
    \              100       396873   79.3746 ms\n+                                                  \
    \    17 ns        17 ns        17 ns\n+                                                       0 ns\
    \         0 ns         0 ns\n+\n+Fibonacci 35                                            100     \
    \  145169   87.1014 ms\n+                                                     468 ns       464 ns\
    \       473 ns\n+                                                      21 ns        15 ns        34\
    \ ns\n+```\n+\n+### Advanced benchmarking\n+The simplest use case shown above, takes no arguments\
    \ and just runs the user code that needs to be measured.\n+However, if using the `BENCHMARK_ADVANCED`\
    \ macro and adding a `Catch::Benchmark::Chronometer` argument after\n+the macro, some advanced features\
    \ are available. The contents of the simple benchmarks are invoked once per run,\n+while the blocks\
    \ of the advanced benchmarks are invoked exactly twice:\n+once during the estimation phase, and another\
    \ time during the execution phase.\n+\n+```c++\n+BENCHMARK(\"simple\"){ return long_computation();\
    \ };\n+\n+BENCHMARK_ADVANCED(\"advanced\")(Catch::Benchmark::Chronometer meter) {\n+    set_up();\n\
    +    meter.measure([] { return long_computation(); });\n+};\n+```\n+\n+These advanced benchmarks no\
    \ longer consist entirely of user code to be measured.\n+In these cases, the code to be measured is\
    \ provided via the\n+`Catch::Benchmark::Chronometer::measure` member function. This allows you to\
    \ set up any\n+kind of state that might be required for the benchmark but is not to be included\n\
    +in the measurements, like making a vector of random integers to feed to a\n+sorting algorithm.\n\
    +\n+A single call to `Catch::Benchmark::Chronometer::measure` performs the actual measurements\n+by\
    \ invoking the callable object passed in as many times as necessary. Anything\n+that needs to be done\
    \ outside the measurement can be done outside the call to\n+`measure`.\n+\n+The callable object passed\
    \ in to `measure` can optionally accept an `int`\n+parameter.\n+\n+```c++\n+meter.measure([](int i)\
    \ { return long_computation(i); });\n+```\n+\n+If it accepts an `int` parameter, the sequence number\
    \ of each run will be passed\n+in, starting with 0. This is useful if you want to measure some mutating\
    \ code,\n+for example. The number of runs can be known beforehand by calling\n+`Catch::Benchmark::Chronometer::runs`;\
    \ with this one can set up a different instance to be\n+mutated by each run.\n+\n+```c++\n+std::vector<std::string>\
    \ v(meter.runs());\n+std::fill(v.begin(), v.end(), test_string());\n+meter.measure([&v](int i) { in_place_escape(v[i]);\
    \ });\n+```\n+\n+Note that it is not possible to simply use the same instance for different runs\n\
    +and resetting it between each run since that would pollute the measurements with\n+the resetting\
    \ code.\n+\n+It is also possible to just provide an argument name to the simple `BENCHMARK` macro\
    \ to get \n+the same semantics as providing a callable to `meter.measure` with `int` argument:\n+\n\
    +```c++\n+BENCHMARK(\"indexed\", i){ return long_computation(i); };\n+```\n+\n+### Constructors and\
    \ destructors\n+\n+All of these tools give you a lot mileage, but there are two things that still\n\
    +need special handling: constructors and destructors. The problem is that if you\n+use automatic objects\
    \ they get destroyed by the end of the scope, so you end up\n+measuring the time for construction\
    \ and destruction together. And if you use\n+dynamic allocation instead, you end up including the\
    \ time to allocate memory in\n+the measurements.\n+\n+To solve this conundrum, Catch provides class\
    \ templates that let you manually\n+construct and destroy objects without dynamic allocation and in\
    \ a way that lets\n+you measure construction and destruction separately.\n+\n+```c++\n+BENCHMARK_ADVANCED(\"\
    construct\")(Catch::Benchmark::Chronometer meter)\n+{\n+    std::vector<Catch::Benchmark::storage_for<std::string>>\
    \ storage(meter.runs());\n+    meter.measure([&](int i) { storage[i].construct(\"thing\"); });\n+})\n\
    +\n+BENCHMARK_ADVANCED(\"destroy\", [](Catch::Benchmark::Chronometer meter)\n+{\n+    std::vector<Catch::Benchmark::destructable_object<std::string>>\
    \ storage(meter.runs());\n+    for(auto&& o : storage)\n+        o.construct(\"thing\");\n+    meter.measure([&](int\
    \ i) { storage[i].destruct(); });\n+})\n+```\n+\n+`Catch::Benchmark::storage_for<T>` objects are just\
    \ pieces of raw storage suitable for `T`\n+objects. You can use the `Catch::Benchmark::storage_for::construct`\
    \ member function to call a constructor and\n+create an object in that storage. So if you want to\
    \ measure the time it takes\n+for a certain constructor to run, you can just measure the time it takes\
    \ to run\n+this function.\n+\n+When the lifetime of a `Catch::Benchmark::storage_for<T>` object ends,\
    \ if an actual object was\n+constructed there it will be automatically destroyed, so nothing leaks.\n\
    +\n+If you want to measure a destructor, though, we need to use\n+`Catch::Benchmark::destructable_object<T>`.\
    \ These objects are similar to\n+`Catch::Benchmark::storage_for<T>` in that construction of the `T`\
    \ object is manual, but\n+it does not destroy anything automatically. Instead, you are required to\
    \ call\n+the `Catch::Benchmark::destructable_object::destruct` member function, which is what you\n\
    +can use to measure the destruction time.\n+\n+### The optimizer\n+\n+Sometimes the optimizer will\
    \ optimize away the very code that you want to\n+measure. There are several ways to use results that\
    \ will prevent the optimiser\n+from removing them. You can use the `volatile` keyword, or you can\
    \ output the\n+value to standard output or to a file, both of which force the program to\n+actually\
    \ generate the value somehow.\n+\n+Catch adds a third option. The values returned by any function\
    \ provided as user\n+code are guaranteed to be evaluated and not optimised out. This means that if\n\
    +your user code consists of computing a certain value, you don't need to bother\n+with using `volatile`\
    \ or forcing output. Just `return` it from the function.\n+That helps with keeping the code in a natural\
    \ fashion.\n+\n+Here's an example:\n+\n+```c++\n+// may measure nothing at all by skipping the long\
    \ calculation since its\n+// result is not used\n+BENCHMARK(\"no return\"){ long_calculation(); };\n\
    +\n+// the result of long_calculation() is guaranteed to be computed somehow\n+BENCHMARK(\"with return\"\
    ){ return long_calculation(); };\n+```\n+\n+However, there's no other form of control over the optimizer\
    \ whatsoever. It is\n+up to you to write a benchmark that actually measures what you want and doesn't\n\
    +just measure the time to do a whole bunch of nothing.\n+\n+To sum up, there are two simple rules:\
    \ whatever you would do in handwritten code\n+to control optimization still works in Catch; and Catch\
    \ makes return values\n+from user code into observable effects that can't be optimized away.\n+\n\
    +<i>Adapted from nonius' documentation.</i>\ndiff --git a/docs/command-line.md b/docs/command-line.md\n\
