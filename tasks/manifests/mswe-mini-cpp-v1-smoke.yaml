- id: nlohmann__json-18
  image: llm-second-opinion/task-nlohmann__json-18:1
  image_id: sha256:f5a978e319295ab010502b2b1d8ae726e548b085e82d2aaa6c3804144fa07750
  problem_statement: |-
    Improper parsing of JSON string "\\"

    Currently the parser assumes if a '\' is before a double quote, the double quote isn't the end of the string.

    Note that there are more complicated cases like this (and their expansion) which need to be handled properly which probably will take more code to support properly: ("\\"", "\\") of arbitrary length. A reverse search which checks if the number of '\' preceding the quote is even or odd would do it: https://github.com/nlohmann/json/blob/master/src/json.cc#L2050

    Performance in backslash-heavy strings may suffer a lot though. Might be better to do a pure forward scan of the string counting backslashes as you go (Lots of memory access, but it should all be prefetched + L1 cached by current x86, x64 CPUs).
  test_patch: "diff --git a/test/json_unit.cc b/test/json_unit.cc\nindex f820ffa892..7856bdd18f 100644\n\
    --- a/test/json_unit.cc\n+++ b/test/json_unit.cc\n@@ -1621,6 +1621,7 @@ TEST_CASE(\"Parser\")\n  \
    \       // escape characters\n         CHECK_THROWS_AS(json::parse(\"\\\"\\\\\\\"\"), std::invalid_argument);\n\
    \         CHECK_NOTHROW(json::parse(\"\\\"\\\\\\\"\\\"\"));\n+        CHECK_NOTHROW(json::parse(\"\
    \\\"\\\\\\\\\\\"\"));\n \n         // quotes must be closed\n         CHECK_THROWS_AS(json::parse(\"\
    \\\"\"), std::invalid_argument);\n"
  gold_patch: "diff --git a/src/json.cc b/src/json.cc\nindex e548366a3d..5cec2d09a9 100644\n--- a/src/json.cc\n\
    +++ b/src/json.cc\n@@ -2042,34 +2042,46 @@ Parses a string after opening quotes (\\p \") where read.\n\
    \ */\n std::string json::parser::parseString()\n {\n-    // get position of closing quotes\n-    auto\
    \ quotepos_ = buffer_.find_first_of(\"\\\"\", pos_);\n-\n-    // if the closing quotes are escaped\
    \ (character before the quotes is a\n-    // backslash), we continue looking for the final quotes\n\
    -    while (quotepos_ != std::string::npos and buffer_[quotepos_ - 1] == '\\\\')\n-    {\n-      \
    \  quotepos_ = buffer_.find_first_of(\"\\\"\", quotepos_ + 1);\n-    }\n+    // remember the position\
    \ where the first character of the string was\n+    const auto startPos = pos_;\n+    // true if and\
    \ only if the amount of backslashes before the current\n+    // character is even\n+    bool evenAmountOfBackslashes\
    \ = true;\n+\n+    // iterate with pos_ over the whole string\n+    for (;pos_ < buffer_.size(); pos_++)\
    \ {\n+        char currentChar = buffer_[pos_];\n+\n+        // currentChar is a quote, so we might\
    \ have found the end of the string\n+        if (currentChar == '\"') {\n+            // but only\
    \ if the amount of backslashes before that quote is even\n+            if (evenAmountOfBackslashes)\
    \ {\n+\n+                const auto stringLength = pos_ - startPos;\n+                // set pos_\
    \ behind the trailing quote\n+                pos_++;\n+                // find next char to parse\n\
    +                next();\n+\n+                // return string inside the quotes\n+              \
    \  return buffer_.substr(startPos, stringLength);\n+            }\n+        }\n \n-    // check if\
    \ closing quotes were found\n-    if (quotepos_ == std::string::npos)\n-    {\n-        error(\"expected\
    \ '\\\"'\");\n+        // remember if we have an even amount of backslashes before the current character\n\
    +        if (currentChar == '\\\\') {\n+            // jump between even/uneven for each backslash\
    \ we encounter\n+            evenAmountOfBackslashes = !evenAmountOfBackslashes;\n+        } else\
    \ {\n+            // zero backslashes are also an even number, so as soon as we encounter a non-backslash\n\
    +            // the chain of backslashes breaks and we start again from zero\n+            evenAmountOfBackslashes\
    \ = true;\n+        }\n     }\n \n-    // store the coordinates of the string for the later return\
    \ value\n-    const auto stringBegin = pos_;\n-    const auto stringLength = quotepos_ - pos_;\n-\n\
    -    // set buffer position to the position behind (+1) the closing quote\n-    pos_ = quotepos_ +\
    \ 1;\n-\n-    // read next character\n-    next();\n-\n-    // return the string value\n-    return\
    \ buffer_.substr(stringBegin, stringLength);\n+    // we iterated over the whole string without finding\
    \ a unescaped quote\n+    // so the given string is malformed\n+    error(\"expected '\\\"'\");\n\
    \ }\n \n /*!\n"
