    \ Benchmark {\n+        namespace Detail {\n+            template <typename T>\n+            using\
    \ Decay = typename std::decay<T>::type;\n+            template <typename T, typename U>\n+       \
    \     struct is_related\n+                : std::is_same<Decay<T>, Decay<U>> {};\n+\n+           \
    \ /// We need to reinvent std::function because every piece of code that might add overhead\n+   \
    \         /// in a measurement context needs to have consistent performance characteristics so that\
    \ we\n+            /// can account for it in the measurement.\n+            /// Implementations of\
