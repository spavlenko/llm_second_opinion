    \n+#if defined(CATCH_CONFIG_ENABLE_BENCHMARKING)\n+namespace {\n+    struct manual_clock {\n+    public:\n\
    +        using duration = std::chrono::nanoseconds;\n+        using time_point = std::chrono::time_point<manual_clock,\
