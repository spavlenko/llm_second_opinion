    \      enum { is_steady = true };\n+\n+        static time_point now() {\n+            return time_point(duration(tick()));\n\
    +        }\n+\n+        static void advance(int ticks = 1) {\n+            tick() += ticks;\n+   \
    \     }\n+\n+    private:\n+        static rep& tick() {\n+            static rep the_tick = 0;\n\
