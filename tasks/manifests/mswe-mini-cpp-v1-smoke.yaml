    index 9b5b0ed7c8..f4d1299ae6 100644\n--- a/projects/SelfTest/IntrospectiveTests/CmdLine.tests.cpp\n\
    +++ b/projects/SelfTest/IntrospectiveTests/CmdLine.tests.cpp\n@@ -462,4 +462,30 @@ TEST_CASE( \"Process\
    \ can be configured on command line\", \"[config][command-line]\"\n #endif\n         }\n     }\n+\n\
    +    SECTION(\"Benchmark options\") {\n+        SECTION(\"samples\") {\n+            CHECK(cli.parse({\
    \ \"test\", \"--benchmark-samples=200\" }));\n+\n+            REQUIRE(config.benchmarkSamples == 200);\n\
    +        }\n+        \n+        SECTION(\"resamples\") {\n+            CHECK(cli.parse({ \"test\"\
    , \"--benchmark-resamples=20000\" }));\n+\n+            REQUIRE(config.benchmarkResamples == 20000);\n\
    +        }\n+\n+        SECTION(\"resamples\") {\n+            CHECK(cli.parse({ \"test\", \"--benchmark-confidence-interval=0.99\"\
