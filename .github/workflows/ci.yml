name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - run: pip install -e ".[dev,tracking]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: bench schemas --check
      # The runner has Docker, so the container tests run too (they build the toy image).
      - run: pytest -q

  plugin:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: plugin/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      - run: pnpm build
      - run: pnpm test
